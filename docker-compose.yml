
services:
  yuvomi:
    image: ghcr.io/ulsklyc/yuvomi:latest
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      MODULES_DIR: /app/modules

      DOCUMENT_STORAGE_LOCAL_ENABLED: ${DOCUMENT_STORAGE_LOCAL_ENABLED:-false}
      DOCUMENT_STORAGE_LOCAL_PATH: /documents

      SESSION_SECURE: "true"
      TRUST_PROXY: "1"

    volumes:
      - yuvomi_data:/data
      - yuvomi_backups:/backups
      - yuvomi_modules:/app/modules
      - yuvomi_documents:/documents

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  yuvomi_data:
  yuvomi_backups:
  yuvomi_modules:
  yuvomi_documents:
